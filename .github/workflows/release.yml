name: Release

on:
  # Cutting a release: push a `v*` tag and this publishes a GitHub Release
  # with the Windows and Linux binaries attached.
  push:
    tags: ["v*"]
  # Building ad hoc: run this by hand and the binaries show up as artifacts of
  # the workflow run, without creating a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: roblox-server-search
            asset: roblox-server-search-linux-x86_64
          - name: windows-x86_64
            os: windows-latest
            binary: roblox-server-search.exe
            asset: roblox-server-search-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      # `shell: bash` matters: Windows runners default to pwsh.
      - name: Build release binary
        shell: bash
        run: cargo build --release

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cp "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      # Cargo.lock is worth keeping: it pins the exact dependency versions that
      # produced the binaries.
      - name: Upload Cargo.lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
